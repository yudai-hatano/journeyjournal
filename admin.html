<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>管理画面 | JourneyJournal</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body { background: var(--night-900); min-height: 100vh; }
  .admin-wrap { max-width: 760px; margin: 0 auto; padding: 64px 24px 100px; }
  .admin-brand { text-align: center; color: var(--paper); font-weight: 700; font-size: 1.2rem; margin-bottom: 40px; }
  .admin-brand span { display: block; font-size: 0.7rem; color: var(--gold-400); letter-spacing: 0.1em; margin-top: 4px; }
  .admin-panel { background: var(--paper); border-radius: var(--radius-lg); padding: 36px; box-shadow: var(--shadow-soft); }
  .admin-panel + .admin-panel { margin-top: 24px; }
  .admin-panel h2 { font-size: 1.05rem; font-weight: 700; color: var(--night-800); margin-bottom: 22px; }
  .is-hidden { display: none !important; }
  .form-row { margin-bottom: 18px; }
  .form-row label { display: block; font-size: 0.82rem; font-weight: 500; margin-bottom: 6px; color: var(--ink-600); }
  .form-row input, .form-row select, .form-row textarea {
    width: 100%; padding: 11px 14px; border: 1px solid var(--line); border-radius: var(--radius-sm);
    font-family: inherit; font-size: 0.9rem; background: var(--cream-50); color: var(--ink-900);
  }
  .form-row textarea { min-height: 110px; resize: vertical; }
  .form-actions { display: flex; gap: 10px; }
  .error-text { color: var(--coral-500); font-size: 0.82rem; margin-top: 10px; min-height: 1em; }
  .config-warning {
    display: none; background: var(--coral-100); color: #9a3f2a; border-radius: var(--radius-sm);
    padding: 14px 16px; font-size: 0.82rem; margin-bottom: 20px; line-height: 1.7;
  }
  .config-warning.is-visible { display: block; }
  .admin-topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .admin-topbar span { font-size: 0.85rem; color: var(--ink-600); }
  .btn-mini {
    font-size: 0.76rem; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--paper); color: var(--ink-600);
  }
  .btn-mini--danger { border-color: var(--coral-500); color: var(--coral-500); }
  .admin-news-list { border-top: 1px solid var(--line); }
  .admin-news-item {
    display: flex; justify-content: space-between; align-items: center; gap: 14px;
    padding: 14px 2px; border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  .admin-news-item__main { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; font-size: 0.85rem; }
  .admin-news-item__date { color: var(--ink-400); font-family: var(--font-accent); }
  .admin-news-item__tag { background: var(--gold-100); color: var(--gold-500); padding: 2px 10px; border-radius: 999px; font-size: 0.7rem; font-weight: 700; }
  .admin-news-item__actions { display: flex; gap: 8px; }
  .admin-news-empty { padding: 24px 2px; color: var(--ink-400); font-size: 0.85rem; text-align: center; }
  .back-link { display: block; text-align: center; margin-top: 28px; color: var(--gold-400); font-size: 0.85rem; }
</style>
</head>
<body>
<div class="admin-wrap">
  <div class="admin-brand">JourneyJournal <span>ADMIN CONSOLE</span></div>

  <div id="configWarning" class="config-warning">
    Firebaseがまだ設定されていません。<code>js/firebase-config.js</code> に実際のFirebaseプロジェクトの設定値を入力すると、管理画面が有効になります。詳しくは README.md をご覧ください。
  </div>

  <!-- ログイン -->
  <section id="loginSection" class="admin-panel">
    <h2>管理者ログイン</h2>
    <form id="loginForm">
      <div class="form-row">
        <label for="loginEmail">メールアドレス</label>
        <input type="email" id="loginEmail" required autocomplete="username">
      </div>
      <div class="form-row">
        <label for="loginPassword">パスワード</label>
        <input type="password" id="loginPassword" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn--primary btn--block">ログイン</button>
      <p id="loginError" class="error-text"></p>
    </form>
  </section>

  <!-- 管理画面本体 -->
  <section id="adminSection" class="admin-panel is-hidden">
    <div class="admin-topbar">
      <span>ログイン中: <strong id="userEmail"></strong></span>
      <button id="logoutBtn" class="btn-mini">ログアウト</button>
    </div>

    <h2 id="newsFormTitle">お知らせを新規追加</h2>
    <form id="newsForm">
      <input type="hidden" id="newsId">
      <div class="form-row">
        <label for="titleInput">タイトル</label>
        <input type="text" id="titleInput" required>
      </div>
      <div class="form-row">
        <label for="bodyInput">本文</label>
        <textarea id="bodyInput"></textarea>
      </div>
      <div class="form-row" style="display:flex; gap:16px;">
        <div style="flex:1;">
          <label for="dateInput">日付</label>
          <input type="date" id="dateInput">
        </div>
        <div style="flex:1;">
          <label for="categoryInput">カテゴリ</label>
          <select id="categoryInput">
            <option value="お知らせ">お知らせ</option>
            <option value="サービス">サービス</option>
          </select>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn--primary">保存する</button>
        <button type="button" id="resetFormBtn" class="btn btn--outline is-hidden">新規作成に戻す</button>
      </div>
    </form>
  </section>

  <section id="newsListPanel" class="admin-panel is-hidden">
    <h2>投稿済みのお知らせ</h2>
    <ul id="adminNewsList" class="admin-news-list"></ul>
  </section>

  <a href="index.html" class="back-link">&larr; トップページへ戻る</a>
</div>

<script>
  // ログイン後に一覧パネルを表示する
  document.addEventListener("DOMContentLoaded", () => {
    const observer = new MutationObserver(() => {
      const adminSection = document.getElementById("adminSection");
      const listPanel = document.getElementById("newsListPanel");
      if (adminSection && listPanel) {
        listPanel.classList.toggle("is-hidden", adminSection.classList.contains("is-hidden"));
      }
    });
    const adminSection = document.getElementById("adminSection");
    if (adminSection) observer.observe(adminSection, { attributes: true, attributeFilter: ["class"] });
  });
</script>
<script type="module" src="js/admin.js"></script>
</body>
</html>
