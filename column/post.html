<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<title>コラム記事 | JourneyJournal</title>
<!-- 旧URL(/column/post.html?slug=xxx)を、新しい静的記事ページ
     (/column/xxx.html)へ転送するための互換用ページです。
     記事本体は scripts/build-column-pages.js が生成します。 -->
<script>
  (function () {
    var slug = "";
    try {
      slug = new URLSearchParams(window.location.search).get("slug") || "";
    } catch (e) {
      var m = window.location.search.match(/[?&]slug=([^&]+)/);
      slug = m ? decodeURIComponent(m[1]) : "";
    }
    var target = /^[a-z0-9-]+$/.test(slug) ? "./" + slug + ".html" : "./index.html";
    window.location.replace(target);
  })();
</script>
<meta http-equiv="refresh" content="0; url=./index.html">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="container" style="padding: 140px 24px; text-align: center;">
  <p>コラム記事ページは移動しました。</p>
  <p><a class="btn btn--outline" href="./index.html">コラム一覧へ</a></p>
</div>
</body>
</html>
