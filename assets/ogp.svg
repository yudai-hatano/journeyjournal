<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="20%" cy="-10%" r="120%">
      <stop offset="0%" stop-color="#23375c"/>
      <stop offset="55%" stop-color="#12203a"/>
      <stop offset="100%" stop-color="#182a49"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 星空 -->
  <g fill="#ffffff" opacity="0.55">
    <circle cx="140" cy="90" r="1.6"/>
    <circle cx="330" cy="150" r="1.2"/>
    <circle cx="80" cy="260" r="1.4"/>
    <circle cx="1080" cy="70" r="1.6"/>
    <circle cx="1140" cy="200" r="1.2"/>
    <circle cx="980" cy="120" r="1.4"/>
    <circle cx="1020" cy="480" r="1.4"/>
    <circle cx="200" cy="520" r="1.2"/>
  </g>

  <!-- 旅の軌跡(点線ルート) -->
  <path d="M -20 480 C 220 420, 280 340, 460 360 S 700 480, 860 380 S 1080 180, 1240 140"
        fill="none" stroke="#d9ab5c" stroke-width="2.5" stroke-dasharray="3 16" stroke-linecap="round" opacity="0.5"/>

  <!-- コンパス(装飾) -->
  <g transform="translate(970,315)" opacity="0.18">
    <circle r="180" fill="none" stroke="#d9ab5c" stroke-width="2"/>
    <circle r="138" fill="none" stroke="#d9ab5c" stroke-width="1.5"/>
    <polygon points="0,-78 27,0 0,78 -27,0" fill="#d9ab5c"/>
  </g>

  <!-- ブランドマーク -->
  <g transform="translate(120,150)">
    <circle cx="30" cy="30" r="28" fill="none" stroke="#d9ab5c" stroke-width="3.5"/>
    <polygon points="30,8 38,30 30,52 22,30" fill="#d9ab5c"/>
  </g>

  <!-- ワードマーク -->
  <text x="118" y="272" font-family="'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN',sans-serif" font-size="64" font-weight="700" fill="#fbf7ee">JourneyJournal</text>

  <!-- キャッチコピー -->
  <text x="120" y="330" font-family="'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN',sans-serif" font-size="30" font-weight="700" fill="#d9ab5c">記帳から確定申告まで、ひとつの窓口で。</text>

  <!-- サブ説明 -->
  <text x="120" y="380" font-family="'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN',sans-serif" font-size="22" fill="rgba(251,247,238,0.82)">経理代行・記帳代行 ／ 確定申告の入力サポート ／ 提携税理士のご紹介</text>

  <!-- フッター帯 -->
  <text x="120" y="560" font-family="'Cormorant Garamond',serif" font-size="20" letter-spacing="2" fill="rgba(251,247,238,0.55)">BOOKKEEPING &amp; TAX FILING SUPPORT</text>
</svg>
